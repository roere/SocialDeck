<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/public
    <Directory /var/www/public>
        AllowOverride None
        Options -Indexes
        Require all granted
        DirectoryIndex index.html
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/index\.php$
        RewriteRule ^api(?:/.*)?$ /api/index.php [END,QSA]
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(?:env|ini|log|sql|ya?ml|md|dist|bak|conf)$">
        Require all denied
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" social_post_safe
    CustomLog ${APACHE_LOG_DIR}/access.log social_post_safe
</VirtualHost>
