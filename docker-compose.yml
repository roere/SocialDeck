services:
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "${SOCIALDECK_HTTP_BIND:-127.0.0.1}:${SOCIALDECK_HTTP_PORT:-18080}:80"
    depends_on:
      php:
        condition: service_healthy
    volumes:
      - ./public:/var/www/app/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/ping | grep -q '\"database\":\"connected\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  php:
    build: ./web
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-social_deck}
      DB_USER: ${DB_USER:-social_deck}
      DB_PASSWORD: ${DB_PASSWORD}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public:/var/www/app/public:ro
      - ./api:/var/www/app/api:ro
      - ./scripts:/var/www/app/scripts:ro
      - ./database:/var/www/app/database:ro
      - ./tests:/var/www/app/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: mariadb:11.8.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-social_deck}
      MARIADB_USER: ${DB_USER:-social_deck}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb_data:
