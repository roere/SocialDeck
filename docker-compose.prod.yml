services:
  nginx:
    ports: !override
      - "${SOCIALDECK_HTTP_BIND:-127.0.0.1}:${SOCIALDECK_HTTP_PORT:-18080}:80"
  php:
    environment:
      APP_ENV: production
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY must be set}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: social_deck
      DB_USER: social_deck
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?INITIAL_ADMIN_USERNAME must be set}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL must be set}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set}
  db:
    environment:
      MARIADB_DATABASE: social_deck
      MARIADB_USER: social_deck
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
