server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/app/public;
    index index.html;
    autoindex off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:env|ini|log|sql|ya?ml|md|dist|bak|conf)$ {
        deny all;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
