services:
  nginx:
    ports: !override
      - "127.0.0.1:${SOCIAL_POST_TEST_PORT:-18081}:80"
  php:
    environment:
      APP_ENV: test
      LINKEDIN_AUTHORIZE_ENDPOINT: http://127.0.0.1:19090/authorize
      LINKEDIN_TOKEN_ENDPOINT: http://127.0.0.1:19090/token
      LINKEDIN_USERINFO_ENDPOINT: http://127.0.0.1:19090/userinfo
      LINKEDIN_API_ENDPOINT: http://127.0.0.1:19090
  db:
    volumes:
      - test_mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  test_mariadb_data:
